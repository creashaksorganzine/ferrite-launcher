name: Build Ferrite Launcher

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        strategy:
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Build release
              run: cargo build --release

            - name: Upload Linux build
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v4
              with:
                  name: ferrite-launcher-linux
                  path: target/release/ferrite-launcher

            - name: Upload Windows build
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: ferrite-launcher-windows
                  path: target/release/ferrite-launcher.exe
