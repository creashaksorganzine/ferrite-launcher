name: Build Ferrite Launcher

on:
    push:
        branches:
            - main
        tags:
            - "v*"

    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Build release
              run: cargo build --release

            - name: Upload Linux artifact
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v4
              with:
                  name: ferrite-launcher-linux
                  path: target/release/ferrite-launcher

            - name: Upload Windows artifact
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v4
              with:
                  name: ferrite-launcher-windows
                  path: target/release/ferrite-launcher.exe

            - name: Upload macOS artifact
              if: runner.os == 'macOS'
              uses: actions/upload-artifact@v4
              with:
                  name: ferrite-launcher-macos
                  path: target/release/ferrite-launcher

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: true
                  generate_release_notes: true
                  files: |
                      artifacts/ferrite-launcher-linux/ferrite-launcher
                      artifacts/ferrite-launcher-windows/ferrite-launcher.exe
                      artifacts/ferrite-launcher-macos/ferrite-launcher
